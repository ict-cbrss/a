# Build the timetable in the cloud: nothing to install on anyone's computer.
#
# Run it from GitHub: Actions -> "Build timetable" -> Run workflow. It reads
# timetable/TTable.txt (the current timetable; no student data) and config/,
# or next/TTable.txt and next/config when "plan" is next (see README:
# Next term and rollover),
# runs the checks, the solver (unless told not to) and the print sheets, and
# publishes everything as a downloadable artifact: the editor page, the new
# TTable.txt for TASS, and the PDFs.
#
# SCourse.txt holds student names, so it is not kept in the repository. The
# cloud build therefore has empty student views and no student-clash check;
# run `python -m tt check` with both files where SCourse.txt is kept to see
# student clashes.
name: Build timetable

on:
  workflow_dispatch:
    inputs:
      solve:
        description: "Run the solver (otherwise just check, build the editor and the PDFs)"
        type: boolean
        default: true
      time:
        description: "Seconds the solver may search"
        default: "120"
      plan:
        description: "Which timetable to build: the current term, or next term's plan in next/"
        type: choice
        options: [current, next]
        default: current

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install ortools playwright
          playwright install --with-deps chromium
      - name: Student file (empty placeholder; see note at top)
        run: |
          mkdir -p out
          : > out/SCourse.txt
      - name: Which plan
        run: |
          if [ "${{ inputs.plan }}" = next ]; then
            echo "TT=next/TTable.txt" >> "$GITHUB_ENV"; echo "CFG=next/config" >> "$GITHUB_ENV"
          else
            echo "TT=timetable/TTable.txt" >> "$GITHUB_ENV"; echo "CFG=config" >> "$GITHUB_ENV"
          fi
      - name: Check the timetable
        run: python -m tt check "$TT" out/SCourse.txt -c "$CFG" || true
      - name: Solve
        if: ${{ inputs.solve }}
        run: python -m tt solve "$TT" out/SCourse.txt -c "$CFG" -o out/solved -t ${{ inputs.time }}
      - name: Editor and PDFs for the result
        run: |
          SRC="$TT"
          if [ -f out/solved/TTable.txt ]; then SRC=out/solved/TTable.txt; fi
          python -m tt report "$SRC" out/SCourse.txt -c "$CFG" -o out/timetable.html
          python -m tt pdf "$SRC" out/SCourse.txt -c "$CFG" -o out/pdf
          cp "$SRC" out/TTable.txt
      - uses: actions/upload-artifact@v4
        with:
          name: timetable
          path: out
